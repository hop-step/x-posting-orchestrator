openapi: 3.1.0
info:
  title: X Posting Orchestrator API
  version: 0.1.0
servers:
  - url: /v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        requestId: { type: string }
    PublicationRequest:
      type: object
      required: [xAccountId, scheduledAt, kind, content, overflowPolicy]
      properties:
        xAccountId: { type: string }
        scheduledAt: { type: string, examples: ["2026-06-22T12:00:00+09:00"] }
        kind: { enum: [TEXT, IMAGE, POLL] }
        content:
          type: object
          required: [text]
          properties:
            text: { type: string }
            mediaIds: { type: array, items: { type: string } }
            poll:
              type: object
              properties:
                options: { type: array, minItems: 2, maxItems: 4, items: { type: string } }
                durationMinutes: { type: integer }
            madeWithAi: { type: boolean }
        overflowPolicy: { enum: [REJECT, THREAD, LONGFORM_THEN_THREAD] }
        threadOptions:
          type: object
          properties:
            numbering: { type: boolean }
            maxParts: { type: integer }
            mediaPlacement: { enum: [FIRST] }
        followUps:
          type: array
          items:
            type: object
            properties:
              trigger:
                type: object
                properties:
                  type: { enum: [AFTER_PARENT_PUBLISHED, AFTER_POLL_CLOSE] }
                  offsetMinutes: { type: integer }
              content:
                type: object
                properties:
                  text: { type: string }
        approvalPreference: { enum: [POLICY, REQUIRE_APPROVAL] }
paths:
  /healthz:
    get:
      security: []
      responses:
        "200": { description: OK }
  /publications/preview:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationRequest" }
      responses:
        "200": { description: Preview }
        "422": { description: Domain validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /publications:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationRequest" }
      responses:
        "201": { description: Created }
        "409": { description: Idempotency conflict }
    get:
      responses:
        "200": { description: List publications }
  /publications/{id}:
    get:
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Publication detail }
    patch:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationRequest" }
      responses:
        "200": { description: Updated }
  /publications/{id}/submit:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Submitted }
  /publications/{id}/approve:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Approved }
  /publications/{id}/reject:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Rejected }
  /publications/{id}/cancel:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Cancelled }
  /publications/{id}/retry:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Retry scheduled }
  /publications/{id}/reconcile:
    post:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Reconciled }
  /media:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                xAccountId: { type: string }
                file: { type: string, format: binary }
                altText: { type: string, maxLength: 1000 }
                aiGenerated: { type: boolean }
      responses:
        "201": { description: Uploaded }
  /media/{id}:
    get:
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Media metadata }
  /x/accounts:
    post:
      responses:
        "201": { description: Account record created }
    get:
      responses:
        "200": { description: Account list }
  /x/oauth/authorize:
    get:
      parameters: [{ in: query, name: xAccountId, required: true, schema: { type: string } }]
      responses:
        "302": { description: Redirect to X OAuth }
  /x/oauth/callback:
    get:
      security: []
      responses:
        "200": { description: OAuth callback consumed }
  /x/accounts/{id}/disable:
    post:
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Disabled }
  /x/accounts/{id}/capabilities:
    patch:
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Capabilities updated }
